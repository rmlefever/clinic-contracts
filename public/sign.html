<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Contract</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="sign-shell">
      <h1>Review and sign</h1>
      <div id="message" class="panel muted">Loading contract...</div>
      <div id="otpStep" class="panel hidden">
        <h2>Verify your email</h2>
        <p id="otpIntro" class="muted">For security, we email a verification code before you can sign.</p>
        <div id="otpSendControls" class="form-grid">
          <button type="button" id="otpSend">Email me a code</button>
        </div>
        <div id="otpVerifyControls" class="form-grid hidden">
          <label>Verification code<input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></label>
          <button type="button" id="otpVerify">Verify code</button>
          <button type="button" class="secondary" id="otpResend">Resend code</button>
        </div>
      </div>
      <div id="signer" class="sign-layout hidden">
        <div class="panel">
          <iframe id="pdfFrame" title="Contract PDF" style="width:100%;height:720px;border:0"></iframe>
        </div>
        <form id="signForm" class="panel grid"></form>
      </div>
    </main>
    <script src="/sign.js" type="module"></script>
  </body>
</html>
